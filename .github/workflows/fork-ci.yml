name: Fork CI

on:
  pull_request:
    branches: [product]
  push:
    branches: [product]
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package.json
            tests/package.json

      - name: Install application dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install test dependencies without lifecycle scripts
        run: npm install --prefix tests --ignore-scripts --no-audit --no-fund

      - name: Run blocking fork regression tests
        run: npm run test:fork --prefix tests

      - name: Build production application
        run: npm run build
